<h2>Registrar patrimonio mensual</h2>

<div class="form-card">
  <form (ngSubmit)="guardar()" class="form">

    <div class="form-group">
      <label for="categoria">Categoría</label>
      <select id="categoria" [(ngModel)]="categoria" name="categoria" required>
        <option value="">Seleccione una categoría</option>
        <option *ngFor="let c of categorias" [ngValue]="c">{{ c }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="mes">Mes</label>
      <input id="mes" type="month" [(ngModel)]="mes" name="mes" required/>
    </div>

    <div class="form-group">
      <label for="valor">Valor (€)</label>
      <input id="valor" type="number" [(ngModel)]="valor" name="valor" required/>
    </div>

    <button type="submit">Guardar</button>

  </form>
</div>
