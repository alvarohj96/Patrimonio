<h2>Registrar patrimonio mensual</h2>

<div class="form-card">
  <form (ngSubmit)="guardar()" class="form">

    <div class="form-group">
      <label for="categoria">Categoría</label>
      <select id="categoria" [(ngModel)]="categoria" name="categoria" required>
        <option value="">Seleccione una categoría</option>
        <option *ngFor="let c of categorias" [ngValue]="c">{{ c }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="mes">Mes</label>
      <input id="mes" type="month" [(ngModel)]="mes" name="mes" required/>
    </div>

    <div class="form-group">
      <label for="valor">Valor (€)</label>
      <input id="valor" type="number" [(ngModel)]="valor" name="valor" required/>
    </div>

    <button type="submit">Guardar</button>

  </form>
</div>

<div class="tabla-container">
  <div class="table-wrapper">

    <table class="tabla-patrimonio">
      <thead>
        <tr>
          <th>Mes</th>
          <th *ngFor="let c of categorias">{{ c }}</th>
          <th>Total</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let r of registros">
          <td>{{ r.mes }}</td>
          <td *ngFor="let c of categorias">{{ r.valores[c] }}</td>
          <td>{{ getTotal(r) }}</td>
          <td><button class="btn-eliminar" (click)="eliminarRegistro(r)">Eliminar</button></td>
        </tr>
      </tbody>
    </table>

  </div>
</div>
