<mat-card class="card" *ngIf="datosUltimoMes.length > 0">

  <mat-card-title>
    📊 Patrimonio del último mes disponible
  </mat-card-title>

  <mat-card-subtitle>
    Último mes: <strong>{{ ultimoMes }}</strong>
  </mat-card-subtitle>

  <mat-card-content>

    <table mat-table [dataSource]="datosUltimoMes" class="mat-elevation-z2">

      <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef>Categoría</th>
        <td mat-cell *matCellDef="let r">{{ r.categoria }}</td>
      </ng-container>

      <ng-container matColumnDef="valor">
        <th mat-header-cell *matHeaderCellDef>Valor (€)</th>
        <td mat-cell *matCellDef="let r">{{ r.valor | number:'1.0-0' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['categoria','valor']"></tr>
      <tr mat-row *matRowDef="let fila; columns: ['categoria','valor'];"></tr>

    </table>

    <div class="total-global">
      <strong>Total global:</strong> {{ total | number:'1.0-0' }} €
    </div>

  </mat-card-content>

</mat-card>

<mat-card *ngIf="datosUltimoMes.length === 0">
  <mat-card-content>
    No hay datos registrados todavía.
  </mat-card-content>
</mat-card>

<div class="charts-row">

  <mat-card class="chart-card" *ngIf="datosUltimoMes.length > 0" style="margin-top: 20px;">
    <mat-card-title>
      Distribución por categorías
    </mat-card-title>

    <mat-card-content>
      <canvas baseChart [data]="chartData" [type]="'doughnut'">
      </canvas>
    </mat-card-content>
  </mat-card>

  <mat-card class="chart-card">
    <mat-card-header>
      <mat-card-title>Evolución por Activo</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div style="display: block; height: 500px;">
        <canvas baseChart [data]="barChartData" [options]="barChartOptions" [type]="barChartType">
        </canvas>
      </div>
    </mat-card-content>
  </mat-card>
</div>
