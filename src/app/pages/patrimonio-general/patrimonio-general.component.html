<div class="contenedor">

  <!-- ================================
       TARJETA "PATRIMONIO GENERAL" DEL ÚLTIMO MES
  ================================= -->
  <mat-card class="card">
    <h2>Patrimonio del último mes</h2>

    <table mat-table [dataSource]="datosUltimoMes" class="mat-elevation-z2 tabla">

      <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef>Categoría</th>
        <td mat-cell *matCellDef="let r">{{ r.categoria }}</td>
      </ng-container>

      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef>Total</th>
        <td mat-cell *matCellDef="let r">{{ r.total | number:'1.0-0' }} €</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['categoria','total']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['categoria','total']"></tr>
    </table>
  </mat-card>


  <!-- ================================
       GRÁFICO DONUT
  ================================= -->
  <mat-card class="card">
    <h2>Distribución por categorías</h2>
    <canvas baseChart
      [data]="{ labels: chartLabels, datasets: [{ data: chartData, backgroundColor: chartColors[0].backgroundColor }] }"
      type="doughnut" width="300" height="300"></canvas>
  </mat-card>


  <!-- ================================
       GRÁFICO DE BARRAS
  ================================= -->
  <mat-card class="card card-wide">
    <h2>Evolución total por categoría (Barras)</h2>
    <canvas baseChart [data]="barData" [options]="barOptions" type="bar" height="400"></canvas>
  </mat-card>

  <!-- ================================
       GRÁFICO DE LÍNEAS
  ================================= -->
  <mat-card class="card card-wide">
    <h2>Evolución por categorías (Líneas)</h2>
    <canvas baseChart [data]="lineData" type="line" height="400"></canvas>
  </mat-card>

</div>
