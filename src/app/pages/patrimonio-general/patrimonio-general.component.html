<div class="pg-container">

  <!-- ===============================
       SECCIÓN 1: TABLA ÚLTIMO MES
  ================================== -->
  <mat-card class="section-card">
    <mat-card-title>
      💰 Patrimonio del último mes
    </mat-card-title>

    <mat-card-subtitle *ngIf="ultimoMes">
      Último mes disponible: <strong>{{ ultimoMes }}</strong>
    </mat-card-subtitle>

    <mat-card-content>
      <table mat-table [dataSource]="datosUltimoMes" class="mat-elevation-z2 tabla-ultimo-mes">

        <!-- Categoría -->
        <ng-container matColumnDef="categoria">
          <th mat-header-cell *matHeaderCellDef> Categoría </th>
          <td mat-cell *matCellDef="let d"> {{ d.categoria }} </td>
        </ng-container>

        <!-- Valor -->
        <ng-container matColumnDef="valor">
          <th mat-header-cell *matHeaderCellDef> Valor (€) </th>
          <td mat-cell *matCellDef="let d"> {{ d.valor | number:'1.0-0' }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['categoria','valor']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['categoria','valor']"></tr>
      </table>

      <div class="total-line">
        <span>Total patrimonio:</span>
        <strong>{{ total | number:'1.0-0' }} €</strong>
      </div>
    </mat-card-content>
  </mat-card>


  <!-- ===============================
       SECCIÓN 2: GRÁFICOS (2 columnas)
  ================================== -->
  <div class="charts-grid">

    <!-- Donut -->
    <mat-card class="chart-card" *ngIf="datosUltimoMes.length > 0" style="margin-top: 20px;">
    <mat-card-title>
      Distribución por categorías
    </mat-card-title>

    <mat-card-content>
      <canvas baseChart [data]="chartData" [type]="'doughnut'">
      </canvas>
    </mat-card-content>
  </mat-card>

    <!-- Barras -->
    <mat-card class="chart-card">
    <mat-card-header>
      <mat-card-title>Evolución por Activo</mat-card-title>
    </mat-card-header>
    <mat-card-content >
      <div class="chart-card-content" style="display: block;">
        <canvas baseChart [data]="barChartData" [options]="barChartOptions" [type]="barChartType">
        </canvas>
      </div>
    </mat-card-content>
  </mat-card>

  </div>


  <!-- ===============================
       SECCIÓN 3: GRÁFICA DE LÍNEAS
  ================================== -->
  <mat-card class="section-card">
    <mat-card-title>
      📈 Evolución por categoría
    </mat-card-title>
    <mat-card-subtitle>
      Comparativa de activos mes a mes
    </mat-card-subtitle>

    <mat-card-content>
      <canvas baseChart [data]="lineChartData" [type]="'line'"></canvas>
    </mat-card-content>
  </mat-card>

</div>
