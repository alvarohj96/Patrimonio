<mat-toolbar class="app-toolbar" color="primary">

  <!-- TÍTULO -->
  <div class="toolbar-left">
    <mat-icon class="logo-icon">account_balance</mat-icon>
    <span class="app-title">Mi Patrimonio</span>
  </div>

  <span class="spacer"></span>

  <div class="menu">
    <!-- Menú hamburguesa -->
    <button mat-icon-button [matMenuTriggerFor]="menu">
      <mat-icon>menu</mat-icon>
    </button>

    <mat-menu #menu="matMenu" class="menu-hamburguesa">
      <button mat-menu-item routerLink="/general">
        <mat-icon>dashboard</mat-icon>
        Patrimonio general
      </button>

      <button mat-menu-item routerLink="/mensual">
        <mat-icon>edit</mat-icon>
        Entrada mensual
      </button>
    </mat-menu>

    <button mat-icon-button aria-label="Guía de uso" (click)="abrirGuia()">
      <mat-icon>info</mat-icon>
    </button>

    <!-- BOTÓN TEMA -->
    <button mat-icon-button (click)="theme.toggle()" matTooltip="Cambiar tema">
      <mat-icon>
        {{ theme.isDark() ? 'light_mode' : 'dark_mode' }}
      </mat-icon>
    </button>

    <!-- CONFIG -->
    <button mat-icon-button matTooltip="Configuración" (click)="abrirConfiguracion()">
      <mat-icon>settings</mat-icon>
    </button>
  </div>

</mat-toolbar>

<!-- CONTENIDO -->
<div class="app-content">
  <router-outlet></router-outlet>
</div>
