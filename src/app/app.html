<mat-toolbar class="app-toolbar" color="primary">

  <!-- TÍTULO -->
  <div class="toolbar-left">
    <mat-icon class="logo-icon">account_balance</mat-icon>
    <span class="app-title">Mi Patrimonio</span>
  </div>

  <span class="spacer"></span>

  <!-- Navegación principal -->
  <div class="nav-buttons">

    <button mat-button routerLink="/general" routerLinkActive="nav-activo" [routerLinkActiveOptions]="{ exact: true }">
      <mat-icon>dashboard</mat-icon>
      <span>Patrimonio general</span>
    </button>

    <button mat-button routerLink="/mensual" routerLinkActive="nav-activo">
      <mat-icon>edit</mat-icon>
      <span>Entrada mensual</span>
    </button>
  </div>

  <div class="menu">
    <button mat-icon-button aria-label="Guía de uso" (click)="abrirGuia()">
      <mat-icon>info</mat-icon>
    </button>

    <!-- BOTÓN TEMA -->
    <button mat-icon-button (click)="theme.toggle()" matTooltip="Cambiar tema">
      <mat-icon>
        {{ theme.isDark() ? 'light_mode' : 'dark_mode' }}
      </mat-icon>
    </button>

    <!-- CONFIG -->
    <button mat-icon-button matTooltip="Configuración" (click)="abrirConfiguracion()">
      <mat-icon>settings</mat-icon>
    </button>
  </div>

</mat-toolbar>

<!-- CONTENIDO -->
<div class="app-content">
  <router-outlet></router-outlet>
</div>
